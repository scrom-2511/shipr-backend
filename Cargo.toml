[package]
name = "shipr"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.51.0", features = ["full"] }
lapin = "4.4.0"
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.23.0", features = ["v4", "serde"] }
futures = "0.3.32"
url = "2.5.8"
reqwest = { version = "0.13.2", features = ["json", "stream"] }
clap = {version = "4.6.0", features=["derive"]}
actix-web = "4.13.0"
aws-config = "1.8.16"
aws-sdk-s3 = "1.131.0"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
redis = {version = "1.2.1", features = ["tokio-comp", "tokio-rustls-comp"]}
tokio-stream = "0.1.18"
async-stream = "0.3.6"
futures-util = "0.3.32"
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0.99"
bcrypt = "0.19.1"
dotenv = "0.15.0"
validator = { version = "0.20.0", features = ["derive"] }
actix-cors = "0.7.1"
env = "1.0.1"
rustls = { version = "0.23", features = ["ring"] }
aes-gcm = "0.10.3"
aead = "0.5.2"
base64 = "0.22.1"
hickory-proto = "0.26.1"
async-stripe = { version = "0.39.0", features = ["runtime-tokio-hyper", "checkout", "webhook-endpoints", "webhook-events"] }